<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"><title>登录 - 菌元智配 Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:linear-gradient(135deg,#0d6efd,#6610f2);height:100vh;display:flex;align-items:center;justify-content:center}.login-card{background:white;padding:2rem;border-radius:12px;width:400px}</style>
</head>
<body>
<div class="login-card">
    <h3 class="text-center mb-3"><i class="fas fa-bacteria"></i> 菌元智配 Pro V1.4.1</h3>
    <form id="loginForm">
        <input class="form-control mb-2" type="text" id="username" placeholder="医院账号" required>
        <input class="form-control mb-2" type="password" id="password" placeholder="密码" required>
        <input class="form-control mb-2" type="text" id="license_key" placeholder="激活码（首次注册必填）">
        <button class="btn btn-primary w-100" type="submit">登录 / 注册</button>
    </form>
    <div id="msg" class="text-danger mt-2 text-center"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const license_key = document.getElementById('license_key').value;
    const res = await fetch('/api/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username, password, license_key})
    });
    const data = await res.json();
    if (data.token) { localStorage.setItem('token', data.token); window.location.href = '/'; }
    else document.getElementById('msg').innerText = data.error || '登录失败';
});
</script>
</body>
</html>
